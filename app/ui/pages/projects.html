<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="workspace-body">
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-id" id="sidebar-id">
      <button type="button" id="sidebar-brand" class="sidebar-brand" title="Switch or create id">Manager</button>
    </div>
    <form id="create-form" class="create-project-form">
      <textarea id="create-input" rows="2" placeholder="New project…" required></textarea>
      <button type="submit">Create</button>
    </form>
    <p id="create-error" class="error" hidden></p>
    <div id="project-list" class="project-list"></div>
    <p id="list-empty" class="sidebar-empty" hidden>No projects yet.</p>
    <nav class="sidebar-more">
      <a href="settings/general.html">Settings</a>
    </nav>
  </aside>
  <div
    id="sidebar-resize"
    class="sidebar-resize"
    role="separator"
    aria-orientation="vertical"
    aria-label="Resize project list"
    title="Drag to resize project list"
  ></div>
  <div class="workspace">
    <div class="project-column">
      <section id="project-topbar" class="project-topbar" hidden></section>
      <section id="project-main" class="project-main">
        <p id="main-empty" class="workspace-empty">Select a project, or create one.</p>
      </section>
    </div>
    <div
      id="chat-resize"
      class="chat-resize"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize chat"
      title="Drag to resize chat"
    ></div>
    <section id="project-chat" class="project-chat" hidden>
      <div id="chat-thread" class="goal-thread"></div>
      <p id="chat-error" class="error" hidden></p>
      <form id="chat-form" class="feedback-form">
        <textarea id="chat-input" rows="2" placeholder="Talk about this project…" required></textarea>
        <button type="submit">Send</button>
        <button
          type="button"
          id="chat-rail-toggle"
          class="chat-rail-toggle"
          aria-label="Open chat"
          title="Open chat"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2zm2 4v2h12V8H6zm0 4v2h8v-2H6z"
            />
          </svg>
        </button>
      </form>
    </section>
  </div>
</div>
<script type="module" src="dist/pages/projects.js"></script>
</body>
</html>
