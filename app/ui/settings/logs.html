<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Logs</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("ui.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="settings-body">
<main>
  <a class="settings-back" href="/">Projects</a>
  <nav>
    <a href="/settings/general.html">General</a>
    <a href="/settings/directory.html">Directory</a>
    <a href="/settings/archive.html">Archive</a>
    <a href="/settings/logs.html" aria-current="page">Logs</a>
  </nav>

  <div class="settings-stack">
    <section class="settings-logs-scope-bar" id="logs-scope" aria-label="Log scope"></section>
    <section class="settings-register" id="logs" aria-label="Activity log"></section>
  </div>
</main>
<script type="module" src="/dist/settings/logs/page.js"></script>
</body>
</html>
