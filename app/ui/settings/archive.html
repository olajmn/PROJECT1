<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Archive</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("ui.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="settings-body">
<main>
  <h1>Settings</h1>
  <nav>
    <a href="/">Projects</a>
    <a href="/settings/general.html">General</a>
    <a href="/settings/directory.html">Directory</a>
    <a href="/settings/archive.html" aria-current="page">Archive</a>
    <a href="/settings/logs.html">Logs</a>
  </nav>

  <div class="settings-stack">
    <section class="settings-register" id="archive" aria-label="Archived accounts and projects"></section>
  </div>
</main>
<script type="module" src="/dist/settings/archive/page.js"></script>
</body>
</html>
