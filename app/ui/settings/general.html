<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("ui.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="settings-body">
<main>
  <a class="settings-back" href="/">Projects</a>
  <nav>
    <a href="/settings/general.html" aria-current="page">General</a>
    <a href="/settings/directory.html">Directory</a>
    <a href="/settings/archive.html">Archive</a>
    <a href="/settings/logs.html">Logs</a>
  </nav>

  <div class="settings-stack">
    <section class="settings-register" id="appearance" aria-label="Appearance"></section>
    <section class="settings-register" id="model-facts" aria-label="Model"></section>
  </div>
</main>
<script type="module" src="/dist/settings/general/page.js"></script>
</body>
</html>
