<title>Settings</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("ui.theme"); } catch (e) {}
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="settings-body">
<main>

  <nav>
    <a href="/settings/general.html" aria-current="page">General</a>
    <a href="/settings/directory.html">Directory</a>
    <a href="/settings/archive.html">Archive</a>
    <a href="/settings/logs.html">Logs</a>
  </nav>

  <div class="settings-stack settings-stack--narrow">
    <section id="appearance" aria-label="Appearance"></section>
    <section id="model-facts" aria-label="Model"></section>
  </div>
</main>
<script type="module" src="/dist/settings/general/page.js"></script>
</body>
</html>
