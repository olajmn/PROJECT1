<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("ui.theme"); } catch (e) {}
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
<main class="login-panel">
  <p class="login-text">This is a demo. Enter the password you were given.</p>
  <p class="login-text">Your changes are deleted when you log out, after 30 minutes without activity, or after 8 hours at most.</p>
  <form id="login-form" class="login-form">
    <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
    <button type="submit">Log in</button>
  </form>
  <p id="login-error" class="login-error" role="alert"></p>
</main>
<script type="module" src="/dist/demo/login.js"></script>
</body>
</html>
