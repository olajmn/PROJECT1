<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("ui.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="workspace-body">
<div class="app-shell">
  <aside class="sidebar">
    <div class="column-top-bar" aria-hidden="true"></div>
    <div class="sidebar-accounts" id="sidebar-accounts">
      <button type="button" id="sidebar-brand" class="sidebar-brand" title="Switch account">Accounts</button>
      <button
        type="button"
        id="create-open"
        class="sidebar-add"
        title="Create project"
        aria-label="Create project"
      >+</button>
    </div>
    <nav class="sidebar-more">
      <a href="settings/general.html">Settings</a>
    </nav>
  </aside>
  <div
    id="sidebar-resize"
    class="sidebar-resize"
    role="separator"
    aria-orientation="vertical"
    aria-label="Resize project list"
    title="Drag to resize project list"
  ></div>
  <div class="workspace">
    <div class="project-column">
      <section id="project-main" class="project-main">
        <p id="main-empty" class="workspace-empty">Select a project, or create one.</p>
        <div id="create-panel" class="create-panel" hidden>
          <p id="create-heading" class="create-heading">Name a new project.</p>
          <form id="create-form" class="create-project-form">
            <textarea id="create-input" rows="2" placeholder="New project…"></textarea>
            <div class="create-actions">
              <button
                type="submit"
                id="create-bare"
                class="create-bare"
                title="Create a project with this name"
                aria-label="Create project"
              >+</button>
              <button
                type="button"
                id="create-folder"
                title="Turn a folder on this computer into the project's map"
              >Add folder</button>
            </div>
          </form>
          <p id="create-error" class="error" hidden></p>
        </div>
      </section>
    </div>
    <div
      id="chat-resize"
      class="chat-resize"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize chat"
      title="Drag to resize chat"
    ></div>
    <section id="project-chat" class="project-chat" hidden>
      <div class="column-top-bar" aria-hidden="true"></div>
      <button
        type="button"
        id="status-toggle"
        class="chat-brand"
        hidden
        aria-expanded="false"
        title="Show or hide current state"
      >Current state</button>
      <section id="status-panel" class="status-panel" aria-label="Current state" hidden></section>
      <div
        id="status-resize"
        class="status-resize"
        hidden
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize current state"
        title="Drag to resize current state"
      ></div>
      <div id="chat-thread" class="chat-thread"></div>
      <p id="chat-error" class="error" hidden></p>
      <div class="chat-rail-grip">
        <button
          type="button"
          id="chat-rail-grip"
          class="chat-rail-grip-mark"
          aria-label="Open chat"
          title="Open chat"
        ></button>
      </div>
      <form id="chat-form" class="feedback-form">
        <textarea id="chat-input" rows="2" placeholder="Talk about this project…" required></textarea>
        <div class="chat-form-actions">
          <div id="chat-command-menu-host"></div>
          <button type="submit">Send</button>
        </div>
        <button
          type="button"
          id="chat-rail-toggle"
          class="chat-rail-toggle"
          aria-label="Open chat"
          title="Open chat"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2zm2 4v2h12V8H6zm0 4v2h8v-2H6z"
            />
          </svg>
        </button>
      </form>
    </section>
  </div>
</div>
<script type="module" src="dist/index.js"></script>
</body>
</html>
